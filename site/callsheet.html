<title>Main Street Call Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#E7E9E4; --raised:#F3F4F0; --sunk:#DDE0DA;
    --ink:#16191A; --ink-2:#565E5C; --ink-3:#7B8481;
    --rule:#C4C9C1; --rule-hard:#9BA39D;
    --signal:#B83227; --signal-soft:#EFDCD8;
    --good:#2F6B4F; --good-soft:#DCE8E1;
    --warn:#8A6410; --warn-soft:#EFE6CF;
    --font-d:'Archivo','Helvetica Neue',Arial,sans-serif;
    --font-b:'Libre Franklin',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    --font-m:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --paper:#121515; --raised:#1A1E1E; --sunk:#0D1010;
    --ink:#E9EBE7; --ink-2:#A2ABA7; --ink-3:#7B8480;
    --rule:#2C3231; --rule-hard:#434A48;
    --signal:#E2604F; --signal-soft:#3A201C;
    --good:#69B08C; --good-soft:#1B2E25;
    --warn:#D6A93C; --warn-soft:#2E2715;
  }}
  :root[data-theme="dark"]{
    --paper:#121515; --raised:#1A1E1E; --sunk:#0D1010;
    --ink:#E9EBE7; --ink-2:#A2ABA7; --ink-3:#7B8480;
    --rule:#2C3231; --rule-hard:#434A48;
    --signal:#E2604F; --signal-soft:#3A201C;
    --good:#69B08C; --good-soft:#1B2E25;
    --warn:#D6A93C; --warn-soft:#2E2715;
  }

  *{box-sizing:border-box}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-b); font-size:15px; line-height:1.5; margin:0; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px; margin:0 auto; padding-inline:16px}
  .mono{font-family:var(--font-m); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase}
  h1,h2,h3{font-family:var(--font-d); font-weight:800; margin:0; line-height:1.1; letter-spacing:-.02em}
  p{margin:0}
  button{font-family:inherit; cursor:pointer}

  /* header */
  .top{border-bottom:2px solid var(--ink); background:var(--paper); position:sticky; top:env(safe-area-inset-top,0px); z-index:20}
  .top .wrap{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between; padding-block:11px}
  .brand{font-family:var(--font-d); font-weight:800; font-size:15px; text-transform:uppercase}
  .brand span{color:var(--signal)}
  .tallies{display:flex; gap:14px; flex-wrap:wrap}
  .tally{font-family:var(--font-m); font-size:11px; letter-spacing:.05em; color:var(--ink-3); white-space:nowrap}
  .tally b{color:var(--ink); font-weight:500; font-size:13px}
  .tally.hot b{color:var(--signal)}

  /* buttons */
  .btn{font-family:var(--font-d); font-weight:800; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase;
    background:var(--signal); color:#fff; border:1.5px solid var(--signal); padding:8px 13px; border-radius:0; text-decoration:none; display:inline-block}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--rule-hard)}
  .btn.ghost:hover{border-color:var(--ink)}
  .btn.sm{padding:6px 10px; font-size:10.5px}
  .btn[disabled]{opacity:.5; cursor:not-allowed}

  /* layout */
  .grid{display:grid; grid-template-columns:1fr; gap:20px; padding-block:20px 48px}
  @media(min-width:980px){ .grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:24px; align-items:start} }

  .bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px}
  .chip{font-family:var(--font-m); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 10px;
    border:1px solid var(--rule-hard); background:transparent; color:var(--ink-2)}
  .chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}

  /* list */
  .list{border-top:1.5px solid var(--rule-hard)}
  .row{display:grid; grid-template-columns:34px 1fr auto; gap:11px; padding:11px 10px 11px 0; border-bottom:1px solid var(--rule); align-items:center; cursor:pointer; background:transparent}
  .row:hover{background:var(--raised)}
  .row.sel{background:var(--raised); box-shadow:inset 3px 0 0 var(--signal); padding-left:9px}
  .score{font-family:var(--font-m); font-size:13px; font-weight:500; text-align:center; font-variant-numeric:tabular-nums;
    padding:3px 0; border:1px solid var(--rule-hard); color:var(--ink-2)}
  .score.hi{background:var(--signal-soft); border-color:var(--signal); color:var(--signal); font-weight:600}
  .score.mid{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
  .r-name{font-weight:600; font-size:14.5px; line-height:1.25}
  .r-meta{font-family:var(--font-m); font-size:10.5px; color:var(--ink-3); letter-spacing:.03em; margin-top:2px}
  .pill{display:inline-block; font-family:var(--font-m); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; padding:3px 7px; border:1px solid currentColor; white-space:nowrap}
  .pill.new{color:var(--ink-3)}
  .pill.called{color:var(--warn)}
  .pill.booked{color:var(--good); background:var(--good-soft)}
  .pill.dead{color:var(--ink-3); opacity:.6}
  .pill.checked{color:var(--signal)}
  .empty{padding:34px 0; color:var(--ink-3); font-size:14.5px; border-bottom:1px solid var(--rule)}

  /* panel */
  .panel{background:var(--raised); border:1px solid var(--rule-hard); box-shadow:4px 4px 0 var(--sunk)}
  @media(min-width:980px){ .panel{position:sticky; top:74px; max-height:calc(100vh - 96px); overflow-y:auto} }
  .p-hd{padding:13px 15px; border-bottom:1px solid var(--rule-hard); background:var(--sunk); display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
  .p-hd h2{font-size:17px}
  .p-hd .mono{color:var(--ink-3); margin-top:4px}
  .p-body{padding:15px}
  .sec{border-top:1px solid var(--rule); padding-top:13px; margin-top:15px}
  .sec:first-child{border-top:none; padding-top:0; margin-top:0}
  .sec-t{font-family:var(--font-m); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--signal); margin-bottom:9px}
  .links{display:flex; flex-wrap:wrap; gap:7px}
  .q-box{background:var(--paper); border:1px solid var(--rule); padding:9px 11px; font-size:13.5px; color:var(--ink-2); margin-bottom:9px; line-height:1.4}
  .q-box b{color:var(--ink); font-weight:600}

  .ask{display:grid; grid-template-columns:1fr; gap:7px; margin-top:4px}
  .ask-row{display:grid; grid-template-columns:78px 1fr; gap:9px; align-items:center}
  .ask-row > span{font-family:var(--font-m); font-size:11px; color:var(--ink-2); letter-spacing:.04em}
  .seg{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--rule-hard)}
  .seg button{background:transparent; border:none; padding:7px 4px; font-family:var(--font-m); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); border-right:1px solid var(--rule-hard)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--signal); color:#fff}
  .seg button.on.yes{background:var(--good); color:#fff}
  .seg.three{grid-template-columns:1fr 1fr 1fr}
  .seg button.on.neutral{background:var(--rule-hard); color:var(--paper)}
  .checkbox-note{font-size:12.5px; color:var(--ink-2); background:var(--paper); border:1px solid var(--rule); padding:8px 10px; margin-bottom:9px; line-height:1.45}
  .checkbox-note b{color:var(--ink)}

  .fields{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  label{display:block; font-family:var(--font-m); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); margin-bottom:4px}
  input,select,textarea{width:100%; font-family:var(--font-b); font-size:14.5px; color:var(--ink); background:var(--paper);
    border:1px solid var(--rule-hard); padding:8px 10px; border-radius:0; appearance:none}
  textarea{resize:vertical; min-height:62px; font-size:14px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--signal); outline-offset:1px; border-color:var(--signal)}
  .statuses{display:grid; grid-template-columns:repeat(2,1fr); gap:6px}
  @media(min-width:460px){ .statuses{grid-template-columns:repeat(4,1fr)} }
  .statuses button{border:1px solid var(--rule-hard); background:transparent; padding:8px 4px; font-family:var(--font-m); font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2)}
  .statuses button.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}

  .verdict{margin-top:13px; padding:11px 13px; border:2px solid var(--signal); background:var(--signal-soft); color:var(--signal); font-family:var(--font-d); font-weight:800; font-size:14px; line-height:1.3}
  .verdict.cold{border-color:var(--rule-hard); background:var(--sunk); color:var(--ink-2)}
  .verdict small{display:block; font-family:var(--font-b); font-weight:400; font-size:12.5px; margin-top:5px; color:var(--ink-2)}

  dialog{border:1px solid var(--rule-hard); background:var(--raised); color:var(--ink); padding:0; max-width:620px; width:calc(100% - 32px); box-shadow:6px 6px 0 rgba(0,0,0,.18)}
  dialog::backdrop{background:rgba(0,0,0,.42)}
  .d-hd{padding:13px 16px; border-bottom:1px solid var(--rule-hard); background:var(--sunk); display:flex; justify-content:space-between; align-items:center}
  .d-body{padding:16px}
  .hint{font-size:12.5px; color:var(--ink-3); margin-top:8px; line-height:1.5}
  .banner{background:var(--sunk); border:1px solid var(--rule-hard); padding:11px 13px; font-size:13.5px; color:var(--ink-2); margin-bottom:14px; line-height:1.45}
  /* call windows */
  .win{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
  .win i{width:7px; height:7px; border-radius:50%; background:var(--ink-3); display:inline-block}
  .win.best i{background:var(--good)} .win.best{color:var(--good)}
  .win.ok i{background:var(--warn)} .win.ok{color:var(--warn)}
  .win.no i{background:transparent; border:1px solid var(--ink-3)}
  .tag{display:inline-block; font-family:var(--font-m); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--signal); border:1px solid var(--signal); padding:1px 5px; margin-left:6px; vertical-align:2px; white-space:nowrap}
  .plan{border:1px solid var(--rule-hard); background:var(--raised); margin-bottom:14px}
  .plan-hd{display:flex; justify-content:space-between; gap:10px; align-items:baseline; padding:9px 12px; border-bottom:1px solid var(--rule)}
  .plan-hd b{font-family:var(--font-d); font-size:13.5px}
  .plan-row{display:grid; grid-template-columns:92px 1fr auto; gap:10px; padding:7px 12px; font-size:13px; border-bottom:1px solid var(--rule); align-items:center}
  .plan-row:last-child{border-bottom:none}
  .plan-row .mono{color:var(--ink-2)}
  .plan-row span:last-child{font-family:var(--font-m); font-size:11px; color:var(--ink-3); white-space:nowrap}
  @media(max-width:520px){ .plan-row{grid-template-columns:1fr auto} .plan-row .when{grid-column:1/-1; order:3} }

  /* script */
  .say{border-left:3px solid var(--signal); background:var(--paper); padding:9px 12px; font-size:14.5px; line-height:1.5; margin-bottom:8px}
  .say .lbl{display:block; font-family:var(--font-m); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px}
  .say q{quotes:none}
  .stage{font-size:12.5px; color:var(--ink-3); font-style:italic; margin:-2px 0 10px 15px}
  .todo{font-size:12.5px; color:var(--warn); background:var(--warn-soft); border:1px solid var(--warn); padding:6px 9px; margin-bottom:8px}
  details.more{margin-top:6px; border:1px solid var(--rule)}
  details.more summary{cursor:pointer; padding:8px 11px; font-family:var(--font-m); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2)}
  details.more > div{padding:4px 11px 11px}
  .obj{display:grid; grid-template-columns:1fr; gap:2px; padding:8px 0; border-top:1px solid var(--rule); font-size:13.5px}
  .obj:first-child{border-top:none}
  .obj b{font-weight:600}
  .obj span{color:var(--ink-2)}
  .rules{margin:0; padding-left:18px; font-size:13.5px; line-height:1.55}
  .rules li{margin-bottom:3px}
  .d-body h3{font-size:14px; margin:18px 0 8px}
  .d-body h3:first-child{margin-top:0}
  dialog.wide{max-width:720px}
  .d-body{max-height:calc(100vh - 140px); overflow-y:auto}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:24px; background:var(--ink); color:var(--paper);
    font-family:var(--font-m); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:10px 16px; z-index:60}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Call <span>Sheet</span></div>
    <div class="tallies">
      <div class="tally">Leads <b id="t-all">0</b></div>
      <div class="tally hot">Callable now <b id="t-now">0</b></div>
      <div class="tally">Dialed <b id="t-dialed">0</b></div>
      <div class="tally">Talked <b id="t-called">0</b></div>
      <div class="tally">Booked <b id="t-booked">0</b></div>
    </div>
    <div style="display:flex; gap:7px; flex-wrap:wrap">
      <button class="btn sm" id="b-script">Script</button>
      <button class="btn sm ghost" id="b-import">Import</button>
      <button class="btn sm ghost" id="b-export">Export</button>
      <button class="btn sm ghost" id="b-add">Add lead</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid">
    <div>
      <div id="banner" class="banner" hidden></div>
      <div class="plan" id="plan"></div>
      <div class="bar" id="filters">
        <button class="chip on" data-f="all">Best first</button>
        <button class="chip" data-f="now">Call now</button>
        <button class="chip" data-f="hook">Has a hook</button>
        <button class="chip" data-f="follow">Follow up</button>
        <button class="chip" data-f="called">Talked</button>
        <button class="chip" data-f="booked">Booked</button>
        <button class="chip" data-f="dead">Dead</button>
      </div>
      <div class="list" id="list"></div>
    </div>

    <div class="panel" id="panel"></div>
  </div>
</div>

<dialog id="dlg">
  <div class="d-hd"><h2 id="d-title" style="font-size:15px">Add lead</h2><button class="btn sm ghost" id="d-x">Close</button></div>
  <div class="d-body" id="d-body"></div>
</dialog>

<script>
(function(){
  var COL = ['business','trade','phone','city','street','website','email','maps','osm',
             'gbp_claimed','reviews','rating','google_position','chatgpt','gemini','claude',
             'name_known','name_reply','site_checked','status','notes'];
  var STATUSES = ['new','noanswer','vm','called','booked','dead'];
  var SLABEL = {'new':'new','noanswer':'no answer','vm':'voicemail','called':'talked','booked':'booked','dead':'dead'};
  var leads = [], selId = null, filter = 'all', db = null, coll = null, ready = false;
  var serverSeen = Object.create(null);   // every id the server has ever sent us

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(msg){
    var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200);
  }
  function banner(msg){ var b=$('banner'); b.textContent=msg; b.hidden=!msg; }

  // ---- your settings, kept in this browser only ----
  function pref(k, v){
    try{ if(v===undefined) return localStorage.getItem('cs_'+k) || ''; localStorage.setItem('cs_'+k, v); }catch(e){}
    return '';
  }

  // ---- where they are and whether now is a good time ----
  var ZONES = {
    'America/New_York':    {abbr:'Eastern', cities:['fort wayne','knoxville','chattanooga','dayton','toledo','youngstown']},
    'America/Chicago':     {abbr:'Central', cities:['lubbock','wichita','tulsa','shreveport']},
    'America/Denver':      {abbr:'Mountain', cities:[]},
    'America/Los_Angeles': {abbr:'Pacific', cities:['pacoima','north hollywood','van nuys','arleta','sun valley','burbank','los angeles']}
  };
  function zoneOf(l){
    var c = String(l.city||'').toLowerCase().trim();
    for(var z in ZONES){ if(ZONES[z].cities.indexOf(c) >= 0) return z; }
    return null;
  }
  function clock(tz, d){
    var p = {};
    new Intl.DateTimeFormat('en-US', {timeZone:tz, hour:'numeric', minute:'2-digit', weekday:'short', hourCycle:'h23'})
      .formatToParts(d || new Date()).forEach(function(x){ p[x.type] = x.value; });
    return {h:+p.hour % 24, m:+p.minute, day:p.weekday};
  }
  function fmt(mins){
    mins = ((mins % 1440) + 1440) % 1440;
    var h = Math.floor(mins/60), m = mins%60, ap = h<12?'a':'p', h12 = h%12 || 12;
    return h12 + (m ? ':' + (m<10?'0':'') + m : '') + ap;
  }
  // Trades answer before the first job and after the last. Midday they are on a roof or under a truck.
  // Never before 8am or after 8pm their time (TCPA is 8 to 9; we stop earlier). No Sundays.
  var BEST = [[8*60,10*60],[15*60+30,17*60+30]];
  var OK   = [[10*60,15*60+30],[17*60+30,19*60]];
  function windowOf(l){
    var tz = zoneOf(l);
    if(!tz) return {cls:'', txt:'time zone?', rank:1, tz:null};
    var c = clock(tz), t = c.h*60 + c.m, local = fmt(t);
    var inAny = function(ws){ return ws.some(function(w){ return t>=w[0] && t<w[1]; }); };
    if(c.day==='Sun') return {cls:'no', txt:local+' Sun · skip', rank:0, tz:tz};
    if(c.day==='Sat') return t>=9*60 && t<12*60 ? {cls:'ok', txt:local+' Sat · ok', rank:2, tz:tz} : {cls:'no', txt:local+' Sat · wait', rank:0, tz:tz};
    if(inAny(BEST)) return {cls:'best', txt:local+' · best', rank:3, tz:tz};
    if(inAny(OK))   return {cls:'ok', txt:local+' · ok', rank:2, tz:tz};
    return {cls:'no', txt:local+' · too '+(t<8*60?'early':'late'), rank:0, tz:tz};
  }
  // Minutes between their clock and yours, so their windows can be shown on your clock.
  function lag(tz){
    var now = new Date(), a = clock(tz, now), b = {h:now.getHours(), m:now.getMinutes()};
    var d = (a.h*60+a.m) - (b.h*60+b.m);
    if(d > 720) d -= 1440; if(d < -720) d += 1440;
    return d;
  }
  function nextDay(tz){
    var d = tz ? clock(tz).day : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
    return (d==='Fri' || d==='Sat') ? 'Monday' : (d==='Sun' ? 'tomorrow' : 'tomorrow');
  }

  // ---- what the research already found, read out of the notes ----
  function hookOf(l){
    var n = String(l.notes||'');
    var dom = function(re){ var m = n.match(re); return m ? m[1].replace(/[.,;)]+$/,'') : ''; };
    if(/BROKEN LINK|WRONG LINK/.test(n)) return {k:'wrong', tag:'wrong link', pts:30, dom:dom(/points to (\S+)/)};
    if(/RENTED (MICROSITE|SUBDOMAIN)/.test(n)) return {k:'rented', tag:'rented page', pts:20, dom:dom(/is (\S+\.(?:com|net)\S*)/),
      free:/wixsite/.test(n)};
    if(/EMPTY DOMAIN/.test(n)) return {k:'empty', tag:'empty domain', pts:20, dom:dom(/own (\S+\.com)/)};
    if(/unrelated|is a different/.test(n)) return {k:'namesake', tag:'name mix-up', pts:15, dom:dom(/\(([a-z0-9-]+\.[a-z.]+) (?:belongs|is)/)};
    if(/no URL behind it|'n\/a'/.test(n)) return {k:'blank', tag:'blank link', pts:10};
    return null;
  }
  // What one job is worth decides whether $1,000 feels cheap. Stamped concrete is thousands; a cushion is not.
  function tradeOf(l){
    var n = String(l.notes||'') + ' ' + String(l.trade||'');
    if(/cabinet|millwork/i.test(String(l.trade||''))) return {pts:8, why:'big-ticket trade'};
    if(/Concrete & masonry|concrete|masonry|brick/i.test(n)) return {pts:10, why:'big-ticket trade'};
    if(/Welding|gates|iron|fenc/i.test(n)) return {pts:8, why:'big-ticket trade'};
    if(/Tree & landscape|tree|stump/i.test(n)) return {pts:8, why:'emergency and big-ticket work'};
    return {pts:0, why:''};
  }
  function paysForLeads(l){ return /HomeAdvisor|Angi\b|Thumbtack|Networx|Groupon/.test(String(l.notes||'')); }
  function lowRating(l){ return /\b[0-3]\.\d stars/.test(String(l.notes||'')) || (parseFloat(l.rating) && parseFloat(l.rating) < 4); }
  function ownerOf(l){
    var m = String(l.notes||'').match(/[Oo]wner(?:\/operator)?,?\s+([A-Z][a-z]+)/);
    return m ? m[1] : '';
  }

  // ---- priority: how badly do they need this, and is there a reason to call today ----
  function score(l){
    var s = 0;
    if(l.site_checked === 'none') s += 50;                    // verified: no website anywhere
    else if(l.site_checked === 'has') s += 10;                // has one: the bad-site lead
    else if(!l.website) s += 20;                              // unverified hint only
    var h = hookOf(l); if(h) s += h.pts;                      // a specific thing to say
    s += tradeOf(l).pts;                                      // one extra job pays for the year
    if(paysForLeads(l)) s += 5;                               // already spends money to get found
    if(lowRating(l)) s -= 10;                                 // a listing fix will not fix the reviews
    if(l.gbp_claimed === 'no') s += 10;                       // listing never claimed
    var named = ['chatgpt','gemini','claude'].filter(function(k){ return l[k]==='yes'; }).length;
    var asked = ['chatgpt','gemini','claude'].filter(function(k){ return l[k]; }).length;
    if(asked && named === 0) s += 10;                         // invisible to assistants
    else if(asked && named === asked) s -= 30;                // already named: weak call
    if(l.name_known === 'no') s += 10;                        // asked by name, drew a blank
    var pos = parseInt(l.google_position,10);
    if(pos && pos > 3) s += 5;                                // outside the map pack
    var rev = parseInt(l.reviews,10);
    if(rev >= 100) s -= 15;                                   // at capacity, has said no before
    return Math.max(0, Math.min(100, s));
  }
  function checked(l){ return !!(l.chatgpt || l.gemini || l.claude || l.name_known); }

  function ago(iso){
    if(!iso) return '';
    var d = (Date.now() - Date.parse(iso)) / 36e5;
    if(isNaN(d)) return '';
    if(d < 1) return 'just now';
    if(d < 24) return Math.round(d) + 'h ago';
    return Math.round(d/24) + 'd ago';
  }

  // ---- render ----
  var STAGE = {'new':0,'noanswer':1,'vm':1,'called':2,'booked':3,'dead':4};
  function visible(){
    return leads.filter(function(l){
      if(filter==='now') return open(l) && windowOf(l).rank >= 2;
      if(filter==='hook') return !!hookOf(l) && l.status!=='dead';
      if(filter==='follow') return l.status==='noanswer' || l.status==='vm';
      if(filter==='called') return l.status==='called';
      if(filter==='booked') return l.status==='booked';
      if(filter==='dead') return l.status==='dead';
      return true;
    }).sort(function(a,b){
      var sa = STAGE[a.status||'new']||0, sb = STAGE[b.status||'new']||0;
      if(filter==='all' || filter==='hook'){ var oa = sa>1?sa:0, ob = sb>1?sb:0; if(oa!==ob) return oa-ob; }
      if(filter==='now'){ var w = windowOf(b).rank - windowOf(a).rank; if(w) return w; }
      return score(b)-score(a) || windowOf(b).rank-windowOf(a).rank || String(a.business).localeCompare(String(b.business));
    });

    var zones = {}, now = 0;

      if(windowOf(l).rank >= 2) now++;

    var order = ['America/New_York','America/Chicago','America/Denver','America/Los_Angeles','?'];
    var rows = order.filter(function(z){ return zones[z]; }).map(function(z){
      if(z==='?') return '<div class="plan-row"><b>Unknown</b><span class="when mono">Add the city to place them</span><span>'+zones[z]+' open</span></div>';
      var d = lag(z);
      var w = BEST.map(function(b){ return fmt(b[0]-d)+' to '+fmt(b[1]-d); }).join(' and ');
      return '<div class="plan-row"><b>'+ZONES[z].abbr+'</b><span class="when mono">Best on your clock: '+w+'</span><span>'+zones[z]+' open</span></div>';

    var named = ['chatgpt','gemini','claude'].filter(function(k){ return l[k]==='yes'; }).length;

    if(l.name_reply) out.push('I asked ChatGPT about '+biz+' by name this morning. Here’s what it said, word for word: ‘'+l.name_reply.replace(/^["‘“']|["’”']$/g,'')+'’');

    if(asked && !named) out.push('Then I asked it who to call for '+tr+' in '+city+'. It named other shops. Not you.');
    if(h && h.k==='wrong') add(out, 'Your Google listing has a website link on it. It goes to '+(h.dom||'another company’s site')+'. That’s a different company. Anybody who taps it from your listing lands on them.');
    if(h && h.k==='rented') add(out, (h.free

      : 'The website on your listing is '+(h.dom||'a directory page')+'. That page belongs to the directory company, not you. If you stop paying them, it’s gone.'));
    if(h && h.k==='empty') add(out, 'You own '+(h.dom||'your domain')+', but it still says the site is coming soon. People who type it in hit a dead end.');
    if(h && h.k==='namesake') add(out, 'When people search your name, '+(h.dom ? h.dom+', a different company,' : 'a different company with a similar name')+' comes up first.');
    if(h && h.k==='blank') add(out, 'A few directories show a website button for you with nothing behind it. Someone taps it and there’s nowhere to go.');

      if(confirm('Delete '+(l.business||'this lead')+'? This cannot be undone.')) removeLead(l.id);
    });
    $('panel').querySelectorAll('[data-copy]').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.dataset.copy;
        var txt = k==='askName' ? askName : k==='vm' ? vmText(l) : k==='email' ? emailText(l) : ask;
        navigator.clipboard.writeText(txt).then(function(){ toast('Copied'); },
          function(){ toast('Copy failed, select it by hand'); });
      });
    });
    if(keep && $(keep.id)){
      var el = $(keep.id); el.focus();
      try{ if(keep.a!=null) el.setSelectionRange(keep.a, keep.b); }catch(e){}
    }
  }

  // ---- CSV ----
  function parseCSV(text){
    var rows=[], row=[], cur='', q=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
        else cur+=c;
      } else if(c==='"'){ q=true; }
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r'){ cur+=c; }
    }
    if(cur.length||row.length){ row.push(cur); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(c){ return c.trim(); }); });
  }
  function toCSV(){
    var head = ['score'].concat(COL);
    var lines = [head.join(',')];
    visible().forEach(function(l){
      lines.push(head.map(function(c){
        var v = c==='score' ? score(l) : (l[c]||'');
        v = String(v);
        return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
      }).join(','));
    });
    return lines.join('\n');
  }

  function importRows(text){
    var rows = parseCSV(text);
    if(rows.length < 2){ toast('Need a header row and at least one lead'); return; }
    var head = rows[0].map(function(h){ return h.trim().toLowerCase().replace(/\s+/g,'_'); });
    var alias = {name:'business',company:'business',business_name:'business',
                 telephone:'phone',phone_number:'phone',town:'city',url:'website',
                 site:'website',category:'trade',type:'trade'};
    head = head.map(function(h){ return alias[h] || h; });
    if(head.indexOf('business') < 0){ toast('No business/name column found'); return; }

    var added = 0;
    rows.slice(1).forEach(function(r){
      var o = blank();
      head.forEach(function(h,i){ if(COL.indexOf(h)>=0) o[h] = (r[i]||'').trim(); });
      if(!o.business) return;
      var dupe = leads.some(function(x){
        return x.business.toLowerCase()===o.business.toLowerCase()
          && x.phone.replace(/\D/g,'')===o.phone.replace(/\D/g,''); });
      if(dupe) return;
      if(!STATUSES.includes(o.status)) o.status = 'new';
      o.id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      leads.push(o); save(o); added++;
    });
    if(added && !selId) selId = leads[0].id;
    render();
    toast(added ? added+' lead'+(added===1?'':'s')+' imported' : 'Nothing new to import');
    $('dlg').close();
  }

  // clocks move: redraw the list and the panel clock every minute, never the panel itself (you may be typing)
  setInterval(function(){ renderList(); var l = leads.filter(function(x){ return x.id===selId; })[0], c = $('p-clock');
    if(l && c){ var w = windowOf(l); c.className = 'win '+w.cls; c.innerHTML = '<i></i>Their time '+esc(w.txt); } }, 60000);

  render();
  banner('Connecting to your saved list...');

  (async function(){
    try{
      db = await window.claude?.use?.('db');
      if(!db){ banner('Running without storage, so nothing here will be kept. Export before you close the tab.'); return; }
      coll = db.collection('prospects');
      coll.limit(1000).onSnapshot(function(snap){
        var incoming = snap.docs.map(function(d){
          var o = Object.assign(blank(), d.data()); o.id = d.id; return o;
        });
        var here = Object.create(null);
        incoming.forEach(function(d){ serverSeen[d.id] = 1; here[d.id] = 1; });
        // Keep only rows this tab created that the server hasn't confirmed yet.
        // A row the server HAS sent before and is now missing was deleted
        // elsewhere, so it must go rather than linger as a ghost.
        var pending = leads.filter(function(l){ return !serverSeen[l.id] && !here[l.id]; });
        leads = incoming.concat(pending);
        if(selId && !leads.some(function(l){ return l.id===selId; })) selId = null;
        if(!selId && leads.length) selId = visible()[0] && visible()[0].id;
        ready = true; banner(''); render();
      }, function(){ banner('Storage dropped out. Export your list before closing.'); });
    }catch(e){ banner('Running without storage, so nothing here will be kept. Export before you close the tab.'); }
  })();
})();
