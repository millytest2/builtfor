<title>Main Street Call Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#E7E9E4; --raised:#F3F4F0; --sunk:#DDE0DA;
    --ink:#16191A; --ink-2:#565E5C; --ink-3:#7B8481;
    --rule:#C4C9C1; --rule-hard:#9BA39D;
    --signal:#B83227; --signal-soft:#EFDCD8;
    --good:#2F6B4F; --good-soft:#DCE8E1;
    --warn:#8A6410; --warn-soft:#EFE6CF;
    --font-d:'Archivo','Helvetica Neue',Arial,sans-serif;
    --font-b:'Libre Franklin',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    --font-m:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --paper:#121515; --raised:#1A1E1E; --sunk:#0D1010;
    --ink:#E9EBE7; --ink-2:#A2ABA7; --ink-3:#7B8480;
    --rule:#2C3231; --rule-hard:#434A48;
    --signal:#E2604F; --signal-soft:#3A201C;
    --good:#69B08C; --good-soft:#1B2E25;
    --warn:#D6A93C; --warn-soft:#2E2715;
  }}
  :root[data-theme="dark"]{
    --paper:#121515; --raised:#1A1E1E; --sunk:#0D1010;
    --ink:#E9EBE7; --ink-2:#A2ABA7; --ink-3:#7B8480;
    --rule:#2C3231; --rule-hard:#434A48;
    --signal:#E2604F; --signal-soft:#3A201C;
    --good:#69B08C; --good-soft:#1B2E25;
    --warn:#D6A93C; --warn-soft:#2E2715;
  }

  *{box-sizing:border-box}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-b); font-size:15px; line-height:1.5; margin:0; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px; margin:0 auto; padding-inline:16px}
  .mono{font-family:var(--font-m); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase}
  h1,h2,h3{font-family:var(--font-d); font-weight:800; margin:0; line-height:1.1; letter-spacing:-.02em}
  p{margin:0}
  button{font-family:inherit; cursor:pointer}

  /* header */
  .top{border-bottom:2px solid var(--ink); background:var(--paper); position:sticky; top:env(safe-area-inset-top,0px); z-index:20}
  .top .wrap{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between; padding-block:11px}
  .brand{font-family:var(--font-d); font-weight:800; font-size:15px; text-transform:uppercase}
  .brand span{color:var(--signal)}
  .tallies{display:flex; gap:14px; flex-wrap:wrap}
  .tally{font-family:var(--font-m); font-size:11px; letter-spacing:.05em; color:var(--ink-3); white-space:nowrap}
  .tally b{color:var(--ink); font-weight:500; font-size:13px}
  .tally.hot b{color:var(--signal)}

  /* buttons */
  .btn{font-family:var(--font-d); font-weight:800; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase;
    background:var(--signal); color:#fff; border:1.5px solid var(--signal); padding:8px 13px; border-radius:0; text-decoration:none; display:inline-block}
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--rule-hard)}
  .btn.ghost:hover{border-color:var(--ink)}
  .btn.sm{padding:6px 10px; font-size:10.5px}
  .btn[disabled]{opacity:.5; cursor:not-allowed}

  /* layout */
  .grid{display:grid; grid-template-columns:1fr; gap:20px; padding-block:20px 48px}
  @media(min-width:980px){ .grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:24px; align-items:start} }

  .bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px}
  .chip{font-family:var(--font-m); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 10px;
    border:1px solid var(--rule-hard); background:transparent; color:var(--ink-2)}
  .chip.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}

  /* list */
  .list{border-top:1.5px solid var(--rule-hard)}
  .row{display:grid; grid-template-columns:34px 1fr auto; gap:11px; padding:11px 10px 11px 0; border-bottom:1px solid var(--rule); align-items:center; cursor:pointer; background:transparent}
  .row:hover{background:var(--raised)}
  .row.sel{background:var(--raised); box-shadow:inset 3px 0 0 var(--signal); padding-left:9px}
  .score{font-family:var(--font-m); font-size:13px; font-weight:500; text-align:center; font-variant-numeric:tabular-nums;
    padding:3px 0; border:1px solid var(--rule-hard); color:var(--ink-2)}
  .score.hi{background:var(--signal-soft); border-color:var(--signal); color:var(--signal); font-weight:600}
  .score.mid{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
  .r-name{font-weight:600; font-size:14.5px; line-height:1.25}
  .r-meta{font-family:var(--font-m); font-size:10.5px; color:var(--ink-3); letter-spacing:.03em; margin-top:2px}
  .pill{display:inline-block; font-family:var(--font-m); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; padding:3px 7px; border:1px solid currentColor; white-space:nowrap}
  .pill.new{color:var(--ink-3)}
  .pill.called{color:var(--warn)}
  .pill.booked{color:var(--good); background:var(--good-soft)}
  .pill.dead{color:var(--ink-3); opacity:.6}
  .pill.offered{color:var(--signal)}
  .r-meta .due{color:var(--signal); font-weight:600}
  .sc-bar{height:8px; background:var(--sunk); border:1px solid var(--rule-hard); margin:6px 0 4px}
  .sc-bar i{display:block; height:100%; background:var(--good)}
  .pill.won{color:var(--paper); background:var(--good); border-color:var(--good)}
  .tally.sep{color:var(--ink-3); padding-left:10px; border-left:1px solid var(--rule-hard)}
  .sc-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin:10px 0 14px}
  @media(max-width:520px){ .sc-grid{grid-template-columns:repeat(3,1fr)} }
  .sc-cell{border:1px solid var(--rule-hard); padding:10px 8px; text-align:center}
  .sc-cell b{display:block; font-family:var(--font-m); font-size:22px; font-weight:500; color:var(--ink)}
  .sc-cell span{font-family:var(--font-m); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
  .sc-tabs{display:flex; gap:6px; flex-wrap:wrap}
  .sc-hist{width:100%; border-collapse:collapse; font-family:var(--font-m); font-size:11.5px; margin-top:8px}
  .sc-hist th,.sc-hist td{text-align:right; padding:5px 4px; border-bottom:1px solid var(--rule)}
  .sc-hist th:first-child,.sc-hist td:first-child{text-align:left}
  .sc-hist th{color:var(--ink-3); font-weight:400; text-transform:uppercase; font-size:9.5px; letter-spacing:.06em}
  .pill.checked{color:var(--signal)}
  .empty{padding:34px 0; color:var(--ink-3); font-size:14.5px; border-bottom:1px solid var(--rule)}

  /* panel */
  .panel{background:var(--raised); border:1px solid var(--rule-hard); box-shadow:4px 4px 0 var(--sunk)}
  @media(min-width:980px){ .panel{position:sticky; top:74px; max-height:calc(100vh - 96px); overflow-y:auto} }
  .p-hd{padding:13px 15px; border-bottom:1px solid var(--rule-hard); background:var(--sunk); display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
  .p-hd h2{font-size:17px}
  .p-hd .mono{color:var(--ink-3); margin-top:4px}
  .p-body{padding:15px}
  .sec{border-top:1px solid var(--rule); padding-top:13px; margin-top:15px}
  .sec:first-child{border-top:none; padding-top:0; margin-top:0}
  .sec-t{font-family:var(--font-m); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--signal); margin-bottom:9px}
  .links{display:flex; flex-wrap:wrap; gap:7px}
  .q-box{background:var(--paper); border:1px solid var(--rule); padding:9px 11px; font-size:13.5px; color:var(--ink-2); margin-bottom:9px; line-height:1.4}
  .q-box b{color:var(--ink); font-weight:600}

  .ask{display:grid; grid-template-columns:1fr; gap:7px; margin-top:4px}
  .ask-row{display:grid; grid-template-columns:78px 1fr; gap:9px; align-items:center}
  .ask-row > span{font-family:var(--font-m); font-size:11px; color:var(--ink-2); letter-spacing:.04em}
  .seg{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--rule-hard)}
  .seg button{background:transparent; border:none; padding:7px 4px; font-family:var(--font-m); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); border-right:1px solid var(--rule-hard)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--signal); color:#fff}
  .seg button.on.yes{background:var(--good); color:#fff}
  .seg.three{grid-template-columns:1fr 1fr 1fr}
  .seg button.on.neutral{background:var(--rule-hard); color:var(--paper)}
  .checkbox-note{font-size:12.5px; color:var(--ink-2); background:var(--paper); border:1px solid var(--rule); padding:8px 10px; margin-bottom:9px; line-height:1.45}
  .checkbox-note b{color:var(--ink)}

  .fields{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  label{display:block; font-family:var(--font-m); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); margin-bottom:4px}
  input,select,textarea{width:100%; font-family:var(--font-b); font-size:14.5px; color:var(--ink); background:var(--paper);
    border:1px solid var(--rule-hard); padding:8px 10px; border-radius:0; appearance:none}
  textarea{resize:vertical; min-height:62px; font-size:14px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--signal); outline-offset:1px; border-color:var(--signal)}
  .statuses{display:grid; grid-template-columns:repeat(2,1fr); gap:6px}
  @media(min-width:460px){ .statuses{grid-template-columns:repeat(4,1fr)} }
  .statuses button{border:1px solid var(--rule-hard); background:transparent; padding:8px 4px; font-family:var(--font-m); font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2)}
  .statuses button.on{background:var(--ink); color:var(--paper); border-color:var(--ink)}

  .verdict{margin-top:13px; padding:11px 13px; border:2px solid var(--signal); background:var(--signal-soft); color:var(--signal); font-family:var(--font-d); font-weight:800; font-size:14px; line-height:1.3}
  .verdict.cold{border-color:var(--rule-hard); background:var(--sunk); color:var(--ink-2)}
  .verdict small{display:block; font-family:var(--font-b); font-weight:400; font-size:12.5px; margin-top:5px; color:var(--ink-2)}

  dialog{border:1px solid var(--rule-hard); background:var(--raised); color:var(--ink); padding:0; max-width:620px; width:calc(100% - 32px); box-shadow:6px 6px 0 rgba(0,0,0,.18)}
  dialog::backdrop{background:rgba(0,0,0,.42)}
  .d-hd{padding:13px 16px; border-bottom:1px solid var(--rule-hard); background:var(--sunk); display:flex; justify-content:space-between; align-items:center}
  .d-body{padding:16px}
  .hint{font-size:12.5px; color:var(--ink-3); margin-top:8px; line-height:1.5}
  .banner{background:var(--sunk); border:1px solid var(--rule-hard); padding:11px 13px; font-size:13.5px; color:var(--ink-2); margin-bottom:14px; line-height:1.45}
  /* call windows */
  .win{display:inline-flex; align-items:center; gap:5px; white-space:nowrap}
  .win i{width:7px; height:7px; border-radius:50%; background:var(--ink-3); display:inline-block}
  .win.best i{background:var(--good)} .win.best{color:var(--good)}
  .win.ok i{background:var(--warn)} .win.ok{color:var(--warn)}
  .win.no i{background:transparent; border:1px solid var(--ink-3)}
  .tag{display:inline-block; font-family:var(--font-m); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--signal); border:1px solid var(--signal); padding:1px 5px; margin-left:6px; vertical-align:2px; white-space:nowrap}
  .plan{border:1px solid var(--rule-hard); background:var(--raised); margin-bottom:14px}
  .plan-hd{display:flex; justify-content:space-between; gap:10px; align-items:baseline; padding:9px 12px; border-bottom:1px solid var(--rule)}
  .plan-hd b{font-family:var(--font-d); font-size:13.5px}
  .plan-row{display:grid; grid-template-columns:92px 1fr auto; gap:10px; padding:7px 12px; font-size:13px; border-bottom:1px solid var(--rule); align-items:center}
  .plan-row:last-child{border-bottom:none}
  .plan-row .mono{color:var(--ink-2)}
  .plan-row span:last-child{font-family:var(--font-m); font-size:11px; color:var(--ink-3); white-space:nowrap}
  @media(max-width:520px){ .plan-row{grid-template-columns:1fr auto} .plan-row .when{grid-column:1/-1; order:3} }

  /* script */
  .say{border-left:3px solid var(--signal); background:var(--paper); padding:9px 12px; font-size:14.5px; line-height:1.5; margin-bottom:8px}
  .say .lbl{display:block; font-family:var(--font-m); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px}
  .say q{quotes:none}
  .stage{font-size:12.5px; color:var(--ink-3); font-style:italic; margin:-2px 0 10px 15px}
  .todo{font-size:12.5px; color:var(--warn); background:var(--warn-soft); border:1px solid var(--warn); padding:6px 9px; margin-bottom:8px}
  details.more{margin-top:6px; border:1px solid var(--rule)}
  details.more summary{cursor:pointer; padding:8px 11px; font-family:var(--font-m); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2)}
  details.more > div{padding:4px 11px 11px}
  .obj{display:grid; grid-template-columns:1fr; gap:2px; padding:8px 0; border-top:1px solid var(--rule); font-size:13.5px}
  .obj:first-child{border-top:none}
  .obj b{font-weight:600}
  .obj span{color:var(--ink-2)}
  .rules{margin:0; padding-left:18px; font-size:13.5px; line-height:1.55}
  .rules li{margin-bottom:3px}
  .d-body h3{font-size:14px; margin:18px 0 8px}
  .d-body h3:first-child{margin-top:0}
  dialog.wide{max-width:720px}
  .d-body{max-height:calc(100vh - 140px); overflow-y:auto}

  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:24px; background:var(--ink); color:var(--paper);
    font-family:var(--font-m); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:10px 16px; z-index:60}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Call <span>Sheet</span></div>
    <div class="tallies">
      <div class="tally">Leads <b id="t-all">0</b></div>
      <div class="tally hot">Callable now <b id="t-now">0</b></div>
      <div class="tally sep">This week</div>
      <div class="tally">Outreach <b id="t-out">0</b></div>
      <div class="tally">Replies <b id="t-rep">0</b></div>
      <div class="tally">Booked <b id="t-booked">0</b></div>
      <div class="tally">Offers <b id="t-off">0</b></div>
      <div class="tally">Sales <b id="t-won">0</b></div>
      <div class="tally sep">Recurring <b id="t-mrr">$0</b>/mo</div>
    </div>
    <div style="display:flex; gap:7px; flex-wrap:wrap">
      <button class="btn sm" id="b-score">Scorecard</button>
      <button class="btn sm" id="b-script">Script</button>
      <button class="btn sm ghost" id="b-import">Import</button>
      <button class="btn sm ghost" id="b-export">Export</button>
      <button class="btn sm ghost" id="b-add">Add lead</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="grid">
    <div>
      <div id="banner" class="banner" hidden></div>
      <div class="plan" id="plan"></div>
      <div class="bar" id="filters">
        <button class="chip on" data-f="all">Best first</button>
        <button class="chip" data-f="now">Call now</button>
        <button class="chip" data-f="hook">Has a hook</button>
        <button class="chip" data-f="due">Due</button>
        <button class="chip" data-f="follow">Follow up</button>
        <button class="chip" data-f="called">Talked</button>
        <button class="chip" data-f="booked">Booked</button>
        <button class="chip" data-f="offered">Offers</button>
        <button class="chip" data-f="dead">Dead</button>
        <button class="chip" data-f="old" hidden>Old list</button>
      </div>
      <div class="list" id="list"></div>
    </div>

    <div class="panel" id="panel"></div>
  </div>
</div>

<dialog id="dlg">
  <div class="d-hd"><h2 id="d-title" style="font-size:15px">Add lead</h2><button class="btn sm ghost" id="d-x">Close</button></div>
  <div class="d-body" id="d-body"></div>
</dialog>

<script>
(function(){
  var COL = ['business','trade','phone','city','street','website','email','maps','osm',
             'gbp_claimed','reviews','rating','google_position','chatgpt','gemini','claude',
             'name_known','name_reply','site_checked','status','notes','state','niche','list','log','next','plan'];
  var PLANS = {small:{name:'Small', setup:600, mo:99}, standard:{name:'Standard', setup:800, mo:199}, bigger:{name:'Bigger', setup:1000, mo:300}};
  var GOAL = 10000;
  var STATUSES = ['new','noanswer','vm','emailed','called','booked','offered','won','dead'];
  var SLABEL = {'new':'new','noanswer':'no answer','vm':'voicemail','emailed':'emailed','called':'talked',
                'booked':'check booked','offered':'offer made','won':'sold','dead':'dead'};
  var leads = [], selId = null, filter = 'all', db = null, coll = null, ready = false;
  var scColl = null, scNotes = Object.create(null), scPeriod = 'week';
  var serverSeen = Object.create(null);   // every id the server has ever sent us

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(msg){
    var t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 2200);
  }
  function banner(msg){ var b=$('banner'); b.textContent=msg; b.hidden=!msg; }

  // ---- your settings, kept in this browser only ----
  // Dial through Google Voice so the shop sees the business number, never your cell.
  function callBtn(phone){
    var d = phone.replace(/[^0-9]/g,'');
    if(d.length===10) d = '1'+d;
    if(pref('dial')!=='phone')
      return '<a class="btn" data-gv="'+esc(phone)+'" href="https://voice.google.com/u/0/calls?a=nc,%2B'+d+'" target="_blank" rel="noopener">Call '+esc(phone)+' in Voice</a>';
    return '<a class="btn" href="tel:+'+d+'">Call '+esc(phone)+'</a>';
  }
  function pref(k, v){
    try{ if(v===undefined) return localStorage.getItem('cs_'+k) || ''; localStorage.setItem('cs_'+k, v); }catch(e){}
    return '';
  }

  // ---- where they are and whether now is a good time ----
  var ZONES = {
    'America/New_York':    {abbr:'Eastern', cities:['fort wayne','knoxville','chattanooga','dayton','toledo','youngstown']},
    'America/Chicago':     {abbr:'Central', cities:['lubbock','wichita','tulsa','shreveport','amarillo','odessa','midland','oklahoma city','dallas','houston','san antonio','austin','kansas city','omaha','memphis','new orleans','abilene','lawton','wichita falls','san angelo']},
    'America/Denver':      {abbr:'Mountain', cities:['albuquerque','denver','el paso','colorado springs','salt lake city','boise','las cruces','kuna','pueblo']},
    'America/Phoenix':     {abbr:'Arizona', cities:['yuma','phoenix','tucson']},
    'America/Los_Angeles': {abbr:'Pacific', cities:['pacoima','north hollywood','van nuys','arleta','sun valley','burbank','los angeles','bakersfield','fresno','sacramento','san diego','riverside','las vegas','portland','seattle','panorama city','north hills','sylmar','san fernando','visalia','hanford','stockton','victorville','merced','tulare','reseda','northridge','granada hills','sunland','simi valley','camarillo','pomona','west covina','norwalk','whittier','south gate','bellflower','long beach','rialto','apple valley']}
  };
  function zoneOf(l){
    var c = String(l.city||'').toLowerCase().trim();
    for(var z in ZONES){ if(ZONES[z].cities.indexOf(c) >= 0) return z; }
    return null;
  }
  function clock(tz, d){
    var p = {};
    new Intl.DateTimeFormat('en-US', {timeZone:tz, hour:'numeric', minute:'2-digit', weekday:'short', hourCycle:'h23'})
      .formatToParts(d || new Date()).forEach(function(x){ p[x.type] = x.value; });
    return {h:+p.hour % 24, m:+p.minute, day:p.weekday};
  }
  function fmt(mins){
    mins = ((mins % 1440) + 1440) % 1440;
    var h = Math.floor(mins/60), m = mins%60, ap = h<12?'a':'p', h12 = h%12 || 12;
    return h12 + (m ? ':' + (m<10?'0':'') + m : '') + ap;
  }
  // Trades answer before the first job and after the last. Midday they are on a roof or under a truck.
  // Never before 8am or after 8pm their time (TCPA is 8 to 9; we stop earlier). No Sundays.
  var BEST = [[8*60,10*60],[15*60+30,17*60+30]];
  var OK   = [[10*60,15*60+30],[17*60+30,19*60]];
  // Each kind of business has its own quiet hours. Auto shops: never at drop-off (7:30-9) or pickup (4:30-6).
  var WIN = {
    auto:     {best:[[10*60,11*60+30],[14*60,16*60]], ok:[[9*60,10*60],[11*60+30,14*60],[16*60,16*60+30]], label:'auto shops'},
    training: {best:[[10*60,12*60],[13*60,15*60]],    ok:[[9*60,10*60],[12*60,13*60],[15*60,16*60]],      label:'gyms'},
    tutoring: {best:[[11*60,13*60]],                  ok:[[10*60,11*60],[13*60,14*60]],                    label:'tutors'},
    tree:     {best:BEST, ok:OK, label:'tree crews'},
    trade:    {best:BEST, ok:OK, label:'trades'}
  };
  function nicheOf(l){
    if(l.niche) return l.niche;
    var t = String(l.trade||'') + ' ' + String(l.business||'');
    if(/auto|mechanic|smog|brake|transmission|tire/i.test(t)) return 'auto';
    if(/box|gym|train|fitness|strength|studio|muay/i.test(t)) return 'training';
    if(/tutor|learning|test prep/i.test(t)) return 'tutoring';
    if(/tree|stump/i.test(t)) return 'tree';
    return 'trade';
  }
  function winOf(l){ return WIN[nicheOf(l)] || WIN.trade; }
  function inFocus(l){ return l.list !== 'archive'; }
  function todayKey(){ var d = new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function isDue(l){ return !!l.next && l.status!=='dead' && l.status!=='won' && l.next <= todayKey(); }
  function shortDate(k){ var d = new Date(k+'T12:00:00'); return isNaN(d) ? k : d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
  function windowOf(l){
    var tz = zoneOf(l);
    if(!tz) return {cls:'', txt:'time zone?', rank:1, tz:null};
    var c = clock(tz), t = c.h*60 + c.m, local = fmt(t), W = winOf(l);
    var inAny = function(ws){ return ws.some(function(w){ return t>=w[0] && t<w[1]; }); };
    if(c.day==='Sun') return {cls:'no', txt:local+' Sun · skip', rank:0, tz:tz};
    if(c.day==='Sat') return t>=9*60 && t<12*60 ? {cls:'ok', txt:local+' Sat · ok', rank:2, tz:tz} : {cls:'no', txt:local+' Sat · wait', rank:0, tz:tz};
    if(inAny(W.best)) return {cls:'best', txt:local+' · best', rank:3, tz:tz};
    if(inAny(W.ok))   return {cls:'ok', txt:local+' · ok', rank:2, tz:tz};
    return {cls:'no', txt:local+' · too '+(t<8*60?'early':'late'), rank:0, tz:tz};
  }
  // Minutes between their clock and yours, so their windows can be shown on your clock.
  function lag(tz){
    var now = new Date(), a = clock(tz, now), b = {h:now.getHours(), m:now.getMinutes()};
    var d = (a.h*60+a.m) - (b.h*60+b.m);
    if(d > 720) d -= 1440; if(d < -720) d += 1440;
    return d;
  }
  function nextDay(tz){
    var d = tz ? clock(tz).day : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
    return (d==='Fri' || d==='Sat') ? 'Monday' : (d==='Sun' ? 'tomorrow' : 'tomorrow');
  }

  // ---- what the research already found, read out of the notes ----
  function hookOf(l){
    var n = String(l.notes||'');
    var dom = function(re){ var m = n.match(re); return m ? m[1].replace(/[.,;)]+$/,'') : ''; };
    if(/BROKEN LINK|WRONG LINK/.test(n)) return {k:'wrong', tag:'wrong link', pts:30, dom:dom(/points to (\S+)/)};
    if(/RENTED (MICROSITE|SUBDOMAIN)/.test(n)) return {k:'rented', tag:'rented page', pts:20, dom:dom(/is (\S+\.(?:com|net)\S*)/),
      free:/wixsite/.test(n)};
    if(/EMPTY DOMAIN/.test(n)) return {k:'empty', tag:'empty domain', pts:20, dom:dom(/own (\S+\.com)/)};
    if(/unrelated|is a different/.test(n)) return {k:'namesake', tag:'name mix-up', pts:15, dom:dom(/\(([a-z0-9-]+\.[a-z.]+) (?:belongs|is)/)};
    if(/no URL behind it|'n\/a'/.test(n)) return {k:'blank', tag:'blank link', pts:10};
    return null;
  }
  // What one job is worth decides whether $1,000 feels cheap. Stamped concrete is thousands; a cushion is not.
  function tradeOf(l){
    var n = String(l.notes||'') + ' ' + String(l.trade||'');
    if(/cabinet|millwork/i.test(String(l.trade||''))) return {pts:8, why:'big-ticket trade'};
    if(/Concrete & masonry|concrete|masonry|brick/i.test(n)) return {pts:10, why:'big-ticket trade'};
    if(/Welding|gates|iron|fenc/i.test(n)) return {pts:8, why:'big-ticket trade'};
    if(/Tree & landscape|tree|stump/i.test(n)) return {pts:8, why:'emergency and big-ticket work'};
    if(nicheOf(l)==='auto') return {pts:8, why:'repeat customers for years, and one brake job pays the month'};
    return {pts:0, why:''};
  }
  function paysForLeads(l){ return /HomeAdvisor|Angi\b|Thumbtack|Networx|Groupon/.test(String(l.notes||'')); }
  function lowRating(l){ return /\b[0-3]\.\d stars/.test(String(l.notes||'')) || (parseFloat(l.rating) && parseFloat(l.rating) < 4); }
  function ownerOf(l){
    var m = String(l.notes||'').match(/[Oo]wner(?:\/operator)?,?\s+([A-Z][a-z]+)/);
    return m ? m[1] : '';
  }

  // ---- priority: how badly do they need this, and is there a reason to call today ----
  function score(l){
    var s = 0;
    if(l.site_checked === 'none') s += 50;                    // verified: no website anywhere
    else if(l.site_checked === 'has') s += 10;                // has one: the bad-site lead
    else if(!l.website) s += 20;                              // unverified hint only
    var h = hookOf(l); if(h) s += h.pts;                      // a specific thing to say
    s += tradeOf(l).pts;                                      // one extra job pays for the year
    if(paysForLeads(l)) s += 5;                               // already spends money to get found
    if(lowRating(l)) s -= 10;                                 // a listing fix will not fix the reviews
    if(l.gbp_claimed === 'no') s += 10;                       // listing never claimed
    var named = ['chatgpt','gemini','claude'].filter(function(k){ return l[k]==='yes'; }).length;
    var asked = ['chatgpt','gemini','claude'].filter(function(k){ return l[k]; }).length;
    if(asked && named === 0) s += 10;                         // invisible to assistants
    else if(asked && named === asked) s -= 30;                // already named: weak call
    if(l.name_known === 'no') s += 10;                        // asked by name, drew a blank
    var pos = parseInt(l.google_position,10);
    if(pos && pos > 3) s += 5;                                // outside the map pack
    var rev = parseInt(l.reviews,10);
    if(rev >= 100) s -= 15;                                   // at capacity, has said no before
    return Math.max(0, Math.min(100, s));
  }
  function checked(l){ return !!(l.chatgpt || l.gemini || l.claude || l.name_known); }
  function open(l){ return inFocus(l) && ['new','noanswer','vm','emailed'].indexOf(l.status||'new') >= 0; }

  // ---- the scorecard: every status tap is logged with a time, and the numbers are counted from that log ----
  var TOUCH = ['noanswer','vm','emailed','called','booked','offered','won','dead'];
  function logOf(l){ try{ var a = JSON.parse(l.log||'[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function dayKey(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function weekStart(d){ var x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; }
  function periodOf(p){
    var now = new Date(), ws = weekStart(now);
    if(p==='week') return {from:ws, to:null, key:'w'+dayKey(ws), name:'Week of '+ws.toLocaleDateString('en-US',{month:'short',day:'numeric'})};
    if(p==='last'){ var ls = new Date(ws); ls.setDate(ls.getDate()-7);
      return {from:ls, to:ws, key:'w'+dayKey(ls), name:'Week of '+ls.toLocaleDateString('en-US',{month:'short',day:'numeric'})}; }
    return {from:null, to:null, key:null, name:'All time'};
  }
  // Outreach: each lead touched, once per day. Replies: owners actually talked to. The rest: leads that reached that stage.
  function tallyRange(from, to){
    var touches = {}, rep = {}, bk = {}, off = {}, won = {};
    leads.forEach(function(l){ logOf(l).forEach(function(e){
      var t = new Date(e.t); if(isNaN(t)) return;
      if(from && t < from) return; if(to && t >= to) return;
      if(TOUCH.indexOf(e.s) >= 0) touches[l.id+'|'+dayKey(t)] = 1;
      if(['called','booked','offered','won'].indexOf(e.s) >= 0) rep[l.id] = 1;
      if(e.s==='booked') bk[l.id] = 1;
      if(e.s==='offered' || e.s==='won') off[l.id] = 1;
      if(e.s==='won') won[l.id] = 1;
    }); });
    var n = function(o){ return Object.keys(o).length; };
    return [n(touches), n(rep), n(bk), n(off), n(won)];
  }
  function money(p){
    var P = periodOf(p), clients = 0, mrr = 0, setup = 0, missing = 0;
    leads.forEach(function(l){
      if(l.status !== 'won') return;
      var pl = PLANS[l.plan]; clients++;
      if(!pl){ missing++; return; }
      mrr += pl.mo;
      var sold = logOf(l).filter(function(e){ return e.s==='won'; }).map(function(e){ return new Date(e.t); }).pop();
      if(sold && (!P.from || sold >= P.from) && (!P.to || sold < P.to)) setup += pl.setup;
    });
    return {clients:clients, mrr:mrr, setup:setup, missing:missing};
  }
  function tally(p){
    var P = periodOf(p), r = tallyRange(P.from, P.to);
    return {name:P.name, key:P.key, outreach:r[0], replies:r[1], booked:r[2], offers:r[3], sales:r[4]};
  }
  function blank(){
    var o = {}; COL.forEach(function(c){ o[c]=''; }); o.status='new'; return o;
  }

  // ---- persistence ----
  function save(l){
    if(!coll){ return Promise.resolve(); }
    var body = {}; COL.forEach(function(c){ body[c] = l[c]||''; });
    body.updated = new Date().toISOString();
    l.updated = body.updated;
    return coll.doc(l.id).set(body).catch(function(){ toast('Could not save'); });
  }
  function removeLead(id){
    leads = leads.filter(function(l){ return l.id!==id; });
    if(selId===id) selId = leads.length ? leads[0].id : null;
    if(coll) coll.doc(id).delete().catch(function(){});
    render();
  }
  function ago(iso){
    if(!iso) return '';
    var d = (Date.now() - Date.parse(iso)) / 36e5;
    if(isNaN(d)) return '';
    if(d < 1) return 'just now';
    if(d < 24) return Math.round(d) + 'h ago';
    return Math.round(d/24) + 'd ago';
  }

  // ---- render ----
  var STAGE = {'new':0,'noanswer':1,'vm':1,'emailed':1,'called':2,'booked':3,'offered':4,'won':5,'dead':6};
  function visible(){
    return leads.filter(function(l){
      if(filter==='old') return !inFocus(l);
      if(!inFocus(l)) return false;
      if(filter==='now') return open(l) && windowOf(l).rank >= 2;
      if(filter==='hook') return !!hookOf(l) && l.status!=='dead';
      if(filter==='follow') return l.status==='noanswer' || l.status==='vm' || l.status==='emailed';
      if(filter==='called') return l.status==='called';
      if(filter==='booked') return l.status==='booked';
      if(filter==='offered') return l.status==='offered' || l.status==='won';
      if(filter==='due') return isDue(l);
      if(filter==='dead') return l.status==='dead';
      return true;
    }).sort(function(a,b){
      var sa = STAGE[a.status||'new']||0, sb = STAGE[b.status||'new']||0;
      if(filter==='all' || filter==='hook'){ var oa = sa>1?sa:0, ob = sb>1?sb:0; if(oa!==ob) return oa-ob; }
      if(filter==='now'){ var w = windowOf(b).rank - windowOf(a).rank; if(w) return w; }
      return score(b)-score(a) || windowOf(b).rank-windowOf(a).rank || String(a.business).localeCompare(String(b.business));
    });
  }

  function renderPlan(){
    // one row per zone and kind of business, with their best hours shown on your clock
    var groups = {}, now = 0;
    leads.forEach(function(l){
      if(!open(l)) return;
      var tz = zoneOf(l) || '?', k = tz + '|' + (WIN[nicheOf(l)] ? nicheOf(l) : 'trade');
      groups[k] = (groups[k]||0) + 1;
      if(windowOf(l).rank >= 2) now++;
    });
    var order = ['America/Los_Angeles','America/Phoenix','America/Denver','America/Chicago','America/New_York','?'];
    var keys = Object.keys(groups).sort(function(a,b){
      return order.indexOf(a.split('|')[0]) - order.indexOf(b.split('|')[0]) || groups[b]-groups[a]; });
    var rows = keys.map(function(k){
      var z = k.split('|')[0], W = WIN[k.split('|')[1]] || WIN.trade;
      if(z==='?') return '<div class="plan-row"><b>Unknown</b><span class="when mono">Add the city to place them</span><span>'+groups[k]+' open</span></div>';
      var d = lag(z);
      var w = W.best.map(function(b){ return fmt(b[0]-d)+' to '+fmt(b[1]-d); }).join(' and ');
      return '<div class="plan-row"><b>'+ZONES[z].abbr+' '+W.label+'</b><span class="when mono">Best on your clock: '+w+'</span><span>'+groups[k]+' open</span></div>';
    }).join('');
    $('plan').innerHTML = '<div class="plan-hd"><b>When to dial</b><span class="mono" style="color:var(--ink-3)">'
      + now + ' callable right now</span></div>' + rows;
  }

  function renderList(){
    var all = leads.filter(inFocus).length, wk = tally('week');
    $('t-all').textContent = all;
    $('t-now').textContent = leads.filter(function(l){ return open(l) && windowOf(l).rank>=2; }).length;
    $('t-out').textContent = wk.outreach;
    $('t-rep').textContent = wk.replies;
    $('t-booked').textContent = wk.booked;
    $('t-off').textContent = wk.offers;
    $('t-won').textContent = wk.sales;
    $('t-mrr').textContent = '$' + money('all').mrr.toLocaleString();
    var dc = document.querySelector('.chip[data-f="due"]'), nd = leads.filter(function(l){ return inFocus(l) && isDue(l); }).length;
    if(dc) dc.textContent = 'Due' + (nd ? ' · '+nd : '');
    var old = leads.length - all, oc = document.querySelector('.chip[data-f="old"]');
    if(oc){ oc.hidden = !old; oc.textContent = 'Old list · '+old; }
    renderPlan();

    var rows = visible(), html = '';
    if(!rows.length){
      html = '<div class="empty">' + (all
        ? (filter==='now' ? 'Nobody is in a good window right now. The plan above shows when the next one opens.' : 'Nothing in this filter yet.')
        : 'No leads yet. Import a CSV, or Add lead to type one in.') + '</div>';
    }
    rows.forEach(function(l){
      var sc = score(l), cls = sc>=65?'hi':(sc>=45?'mid':'');
      var h = hookOf(l), w = windowOf(l), st = l.status||'new';
      html += '<div class="row'+(l.id===selId?' sel':'')+'" data-id="'+esc(l.id)+'">'
        + '<div class="score '+cls+'">'+sc+'</div>'
        + '<div><div class="r-name">'+esc(l.business||'Untitled')+(h?'<span class="tag">'+h.tag+'</span>':'')+'</div>'
        + '<div class="r-meta">'+[esc(l.phone||'no phone'), esc(l.city||''),
            '<span class="win '+w.cls+'"><i></i>'+esc(w.txt)+'</span>',
            l.next && l.status!=='dead' && l.status!=='won' ? '<span class="'+(isDue(l)?'due':'')+'">next '+esc(shortDate(l.next))+'</span>' : '',
            l.status==='won' && PLANS[l.plan] ? esc(PLANS[l.plan].name)+' $'+PLANS[l.plan].mo+'/mo' : ''].filter(Boolean).join(' · ')+'</div></div>'
        + '<span class="pill '+(st==='noanswer'||st==='vm'||st==='emailed'?'called':st)+'">'+esc(SLABEL[st]||st)+'</span></div>';
    });
    $('list').innerHTML = html;
  }

  function render(){ renderList(); renderPanel(); }

  function seg(l, key, label){
    return '<div class="ask-row"><span>'+label+'</span><div class="seg" data-key="'+key+'">'
      + '<button data-v="no" class="'+(l[key]==='no'?'on':'')+'">Not named</button>'
      + '<button data-v="yes" class="'+(l[key]==='yes'?'on yes':'')+'">Named</button>'
      + '</div></div>';
  }

  // ---- the script, filled in for this shop ----
  function trade1(l){ return String(l.trade||'your trade').split(',')[0].trim(); }
  // how a customer would actually ask, per kind of business
  var ASKS = {auto:'an honest mechanic', training:'a personal trainer', tutoring:'a tutor', tree:'a tree service'};
  var SLOTS = {auto:'at 10:30 or at 2', training:'at 10 or at 1', tutoring:'at 11 or at noon', tree:'at 9 or at 4', trade:'at 9 or at 4'};
  function askPhrase(l){ return ASKS[nicheOf(l)] || ('someone for '+trade1(l)); }
  function add(out, t){ out.push(out.length ? 'And ' + t.charAt(0).toLowerCase() + t.slice(1) : t); }
  function findingLines(l){
    var h = hookOf(l), out = [], biz = l.business || 'your shop', city = l.city || 'town', tr = trade1(l);
    var named = ['chatgpt','gemini','claude'].filter(function(k){ return l[k]==='yes'; }).length;
    var asked = ['chatgpt','gemini','claude'].filter(function(k){ return l[k]; }).length;
    if(l.name_reply) out.push('I asked ChatGPT about '+biz+' by name this morning. Here’s what it said, word for word: ‘'+l.name_reply.replace(/^["‘“']|["’”']$/g,'')+'’');
    else if(l.name_known==='no') out.push('I asked ChatGPT about '+biz+' by name this morning. It had nothing on you.');
    if(asked && !named) out.push('Then I asked it for '+askPhrase(l)+' in '+city+'. It named other shops. Not you.');
    if(h && h.k==='wrong') add(out, 'Your Google listing has a website link on it. It goes to '+(h.dom||'another company’s site')+'. That’s a different company. Anybody who taps it from your listing lands on them.');
    if(h && h.k==='rented') add(out, (h.free
      ? 'The website on your listing is a free Wix address with a personal username in it. Customers can’t remember it and Google barely counts it.'
      : 'The website on your listing is '+(h.dom||'a directory page')+'. That page belongs to the directory company, not you. If you stop paying them, it’s gone.'));
    if(h && h.k==='empty') add(out, 'You own '+(h.dom||'your domain')+', but it still says the site is coming soon. People who type it in hit a dead end.');
    if(h && h.k==='namesake') add(out, 'When people search your name, '+(h.dom ? h.dom+', a different company,' : 'a different company with a similar name')+' comes up first.');
    if(h && h.k==='blank') add(out, 'A few directories show a website button for you with nothing behind it. Someone taps it and there’s nowhere to go.');
    if(!out.length) out.push('I looked up '+biz+' this morning. There’s no website for Google or ChatGPT to read, so when someone asks for '+askPhrase(l)+' in '+city+', you’re easy to miss.');
    return out;
  }
  function vmText(l){
    var cb = pref('cb') || '[your call-back number]';
    return 'Hi, this is Miles with Built for Main Street. I looked up '+(l.business||'your shop')+' on Google and ChatGPT this morning, and there’s something on your listing you’ll want to see. The check is free. Call me back at '+cb+', or email hello at builtformainstreet dot com. Again, '+cb+'. Thanks.';
  }
  function emailText(l){
    var who = ownerOf(l) || 'there', f = findingLines(l);
    return 'Subject: ' + (l.business||'Your shop') + ' on Google and ChatGPT\n\n'
      + 'Hi ' + who + ',\n\n'
      + 'Miles from Built for Main Street. I tried calling earlier.\n\n'
      + f.join(' ') + '\n\n'
      + 'We fix that, and we make sure the people who find you can reach you in one tap. '
      + 'The free check shows exactly what’s missing. Reply with a good time for a 10-minute call.\n\n'
      + 'Miles\nBuilt for Main Street\nbuiltformainstreet.com\n'
      + (pref('addr') || '[your mailing address]') + '\n\n'
      + 'If you’d rather not hear from us, reply "stop" and you won’t.';
  }
  function scriptHTML(l){
    var who = ownerOf(l), tz = zoneOf(l), day = nextDay(tz);
    var f = findingLines(l);
    var needsCheck = !checked(l);
    return ''
      + (needsCheck ? '<div class="todo">60 seconds first: run step 1. What ChatGPT says about them by name is the strongest opener you have.</div>' : '')
      + '<div class="say"><span class="lbl">1 · Open</span>'
        + (who ? '"Hi, is this '+esc(who)+'?"' : '"Hi, am I speaking with the owner of '+esc(l.business||'the shop')+'?"')
        + ' "This is Miles with Built for Main Street. Honest heads-up, this is a cold call. Can I have 30 seconds, and you can hang up after that?"</div>'
      + (nicheOf(l)==='auto' && zoneOf(l)==='America/Los_Angeles'
          ? '<div class="stage">Valley shop: you can walk in instead, 10 to 11:30am or 2 to 4pm. Script → The walk-in.</div>' : '')
      + '<div class="say"><span class="lbl">2 · What you found, then stop</span>"'+f.map(esc).join(' ')+'" "Did you know that?"</div>'
      + '<div class="stage">Stop talking. Count to three. Whatever they say, the next line is a question.</div>'
      + '<div class="say"><span class="lbl">3 · One real question</span>"Where do most of your new '+(nicheOf(l)==='tutoring'?'students':'customers')+' come from right now?" Then: '
        + (nicheOf(l)==='auto' ? '"What kind of job do you want more of? Brakes, diagnostics, the bigger stuff?"' : '"What kind of work do you want more of?"') + '</div>'
      + '<div class="stage">Write the answers in Notes. They go in the check and on the site.</div>'
      + '<div class="say"><span class="lbl">4 · The ask</span>"Here’s what I’d suggest. I run a free check on your '+(nicheOf(l)==='auto'?'shop':'business')+': what Google and ChatGPT say when somebody looks for '+esc(askPhrase(l))+' in '+esc(l.city||'your area')+', and what’s keeping you off the list. Ten minutes. '+day.charAt(0).toUpperCase()+day.slice(1)+' '+(SLOTS[nicheOf(l)]||SLOTS.trade)+', your time?"</div>'
      + '<div class="say"><span class="lbl">5 · Lock it in</span>"Great. What’s the best number and email to send it to?"</div>'
      + '<div class="stage">Tap Check booked below and write the time and their email in Notes and Details. Run the check before the call.</div>'
      + '<details class="more"><summary>If they ask the price</summary><div><div class="say" style="margin-top:6px">"It depends on how many services you offer and how many towns you cover, so I won’t guess. After the check I give you one number, and it doesn’t move."</div>'
        + '<div class="stage">Never a range. A range becomes its floor.</div></div></details>'
      + '<details class="more"><summary>Voicemail (20 seconds, then no text)</summary><div><div class="say" style="margin-top:6px">"'+esc(vmText(l))+'"</div>'

  // ---- CSV ----
  function parseCSV(text){
    var rows=[], row=[], cur='', q=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(q){
        if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
        else cur+=c;
      } else if(c==='"'){ q=true; }
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r'){ cur+=c; }
    }
    if(cur.length||row.length){ row.push(cur); rows.push(row); }
    return rows.filter(function(r){ return r.some(function(c){ return c.trim(); }); });
  }
  function toCSV(){
    var head = ['score'].concat(COL);
    var lines = [head.join(',')];
    visible().forEach(function(l){
      lines.push(head.map(function(c){
        var v = c==='score' ? score(l) : (l[c]||'');
        v = String(v);
        return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
      }).join(','));
    });
    return lines.join('\n');
  }

  function importRows(text){
    var rows = parseCSV(text);
    if(rows.length < 2){ toast('Need a header row and at least one lead'); return; }
    var head = rows[0].map(function(h){ return h.trim().toLowerCase().replace(/\s+/g,'_'); });
    var alias = {name:'business',company:'business',business_name:'business',
                 telephone:'phone',phone_number:'phone',town:'city',url:'website',
                 site:'website',category:'trade',type:'trade'};
    head = head.map(function(h){ return alias[h] || h; });
    if(head.indexOf('business') < 0){ toast('No business/name column found'); return; }

    var added = 0;
    rows.slice(1).forEach(function(r){
      var o = blank();
      head.forEach(function(h,i){ if(COL.indexOf(h)>=0) o[h] = (r[i]||'').trim(); });
      if(!o.business) return;
      var dupe = leads.some(function(x){
        return x.business.toLowerCase()===o.business.toLowerCase()
          && x.phone.replace(/\D/g,'')===o.phone.replace(/\D/g,''); });
      if(dupe) return;
      if(!STATUSES.includes(o.status)) o.status = 'new';
      o.id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      leads.push(o); save(o); added++;
    });
    if(added && !selId) selId = leads[0].id;
    render();
    toast(added ? added+' lead'+(added===1?'':'s')+' imported' : 'Nothing new to import');
    $('dlg').close();
  }

      + '<h3>Call two: show the check, name one price</h3>'
      + '<div class="say"><span class="lbl">Show</span>"Here’s what a stranger sees when they look for you." Read out what ChatGPT said about their name.</div>'
      + '<div class="say"><span class="lbl">Count</span>"How many different services do you do?" "Which towns do your customers come from?" Count grouped services, the way a customer searches.</div>'
      + '<div class="say"><span class="lbl">Name one number</span>'
        + '<b>Up to 4 services, 3 towns, one location:</b> "It’s $600 to build, then $99 a month. That keeps it hosted, edited and your Google listing right."<br>'
        + '<b>Up to 8 services, 6 towns:</b> "It’s $800 to build, then $199 a month. That adds a monthly report on what Google and ChatGPT say about you, and we ask your customers for reviews with a card at the counter."<br>'
        + '<b>More than that, or two locations:</b> "It’s $1,000 to build, then $300 a month. That adds follow-up on every lead and a call with me every month."</div>'
      + '<div class="stage">Most businesses land in Standard. Then stop talking. If they balk, drop services from the site, never the price. Tap Offer made.</div>'
      + '<div class="say"><span class="lbl">Terms, said plainly</span>"We build and host the site. The domain is in your name. The monthly covers hosting, reasonable edits and your Google listing, plus what your plan adds. Cancel with 30 days’ notice. After a year you can buy the site outright for $2,000."</div>'
      + '<div class="say"><span class="lbl">Close</span>"If that works, I’ll send the agreement and the payment link now. When the payment and your photos are in, the two weeks start."</div>'
      + '<div class="stage">Money and photos first. Nothing gets built on spec. Photos are due within 30 days. Paid: tap Sold.</div>'
      + '<div class="say"><span class="lbl">What we don’t do</span>"No ads, no social media, no chatbots, no long contract. We get you found and make you easy to reach, and we show you the numbers every month."</div>'

      + '<h3>When they push back</h3>'
      + O.map(function(o){ return '<div class="obj"><b>'+esc(o[0])+'</b><span>'+esc(o[1])+'</span></div>'; }).join('')

      + '<h3>Voicemail</h3>'
      + '<div class="say">"Hi, this is Miles with Built for Main Street. I looked up [business] on Google and ChatGPT this morning, and there’s something on your listing you’ll want to see. The check is free. Call me back at [number], or email hello at builtformainstreet dot com. Again, [number]. Thanks."</div>'
      + '<div class="stage">Then tap Voicemail. If there’s an email, send the follow-up from the lead’s script and tap Emailed. Never a text.</div>'

      + '<h3>Your details</h3>'
      + '<div class="fields">'
      + '<div><label for="s-cb">Call-back number</label><input id="s-cb" placeholder="Google Voice number" value="'+esc(pref('cb'))+'"></div>'
      + '<div><label for="s-addr">Mailing address</label><input id="s-addr" placeholder="Required in sales emails" value="'+esc(pref('addr'))+'"></div>'
      + '<div><label for="s-dial">Dial with</label><select id="s-dial"><option value="gv"'+(pref('dial')!=='phone'?' selected':'')+'>Google Voice (shows the business number)</option><option value="phone"'+(pref('dial')==='phone'?' selected':'')+'>Phone app (shows your own number)</option></select></div>'
      + '</div>'
      + '<p class="hint">Kept in this browser only, so set them once on each phone or laptop you use. With Google Voice, the Call button opens Voice with the number filled in and copies it too, so your own cell shows on nobody’s caller ID. The address can be a PO box; the law requires one in sales emails.</p>';
    $('dlg').showModal();
    $('s-cb').oninput = function(){ pref('cb', this.value.trim()); renderPanel(); };
    $('s-addr').oninput = function(){ pref('addr', this.value.trim()); };
    $('s-dial').onchange = function(){ pref('dial', this.value); renderPanel(); };
  }

  // ---- the scorecard, for the coach call ----
  function scText(t, note){
    return t.name + '\n'
      + 'Outreach sent: ' + t.outreach + '\n'
      + 'Replies: ' + t.replies + '\n'
      + 'Calls booked: ' + t.booked + '\n'
      + 'Offers made: ' + t.offers + '\n'
      + 'Sales: ' + t.sales + '\n'
      + (t.money ? 'Clients: ' + t.money.clients + ' · Monthly recurring: $' + t.money.mrr.toLocaleString() + ' · Setup collected: $' + t.money.setup.toLocaleString() + '\n' : '')
      + 'Biggest lesson: ' + ((note && note.lesson) || '') + '\n'
      + 'Biggest blocker: ' + ((note && note.blocker) || '');
  }
  function weeksSeen(){
    var ks = {}, first = null;
    leads.forEach(function(l){ logOf(l).forEach(function(e){ var t = new Date(e.t); if(!isNaN(t) && (!first || t < first)) first = t; }); });
    var out = [], w = weekStart(new Date()), stop = first ? weekStart(first) : w;
    for(var i=0; i<12 && w >= stop; i++){ out.push(new Date(w)); w.setDate(w.getDate()-7); }
    return out;
  }
  function openScorecard(){
    $('d-title').textContent = 'Scorecard';
    $('dlg').classList.add('wide');
    function draw(){
      var t = tally(scPeriod), note = t.key ? (scNotes[t.key] || {}) : null, m = money(scPeriod); t.money = m;
      var pct = Math.min(100, Math.round(m.mrr / GOAL * 100));
      var cell = function(v, k){ return '<div class="sc-cell"><b>'+v+'</b><span>'+k+'</span></div>'; };
      var hist = weeksSeen().map(function(w){
        var e = new Date(w); e.setDate(e.getDate()+7);
        var r = tallyRange(w, e);
        return '<tr><td>'+w.toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</td><td>'+r.join('</td><td>')+'</td></tr>';
      }).join('');
      $('d-body').innerHTML =
        '<div class="sc-tabs">'
        + ['week','last','all'].map(function(p){ return '<button class="chip'+(scPeriod===p?' on':'')+'" data-p="'+p+'">'+
            (p==='week'?'This week':p==='last'?'Last week':'All time')+'</button>'; }).join('')
        + '</div>'
        + '<p class="hint" style="margin-top:10px">'+esc(t.name)+'. Counted from the status you tap after every call, walk-in or email. '
        + 'If a number is zero, it says zero. That is where you start.</p>'
        + '<div class="sc-grid">' + cell(t.outreach,'Outreach sent') + cell(t.replies,'Replies') + cell(t.booked,'Calls booked')
        + cell(t.offers,'Offers made') + cell(t.sales,'Sales') + '</div>'
        + '<div class="sc-grid" style="grid-template-columns:repeat(3,1fr); margin-top:0">' + cell(m.clients,'Clients') + cell('$'+m.mrr.toLocaleString(),'Monthly recurring')
        + cell('$'+m.setup.toLocaleString(),'Setup collected') + '</div>'
        + '<div class="sc-bar" role="img" aria-label="'+pct+' percent of the monthly goal"><i style="width:'+pct+'%"></i></div>'
        + '<p class="hint" style="margin-top:0">$'+m.mrr.toLocaleString()+' of $10,000 a month in recurring fees ('+pct+'%). Setup fees come on top.'
        + (m.missing ? ' <b>'+m.missing+' sold lead'+(m.missing===1?' has':'s have')+' no plan set.</b>' : '') + '</p>'
        + (note ? '<div class="fields">'
          + '<div style="grid-column:1/-1"><label for="sc-lesson">Biggest lesson</label><textarea id="sc-lesson" style="min-height:52px" placeholder="One sentence. What would you do differently on the next call?">'+esc(note.lesson||'')+'</textarea></div>'
          + '<div style="grid-column:1/-1"><label for="sc-blocker">Biggest blocker</label><textarea id="sc-blocker" style="min-height:52px" placeholder="One sentence. What stopped more calls from happening?">'+esc(note.blocker||'')+'</textarea></div>'
          + '</div>' : '')
        + '<div style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap"><button class="btn" id="sc-copy">Copy for the coach</button></div>'
        + '<p class="hint">Outreach sent: each lead you touched, once per day (dial, walk-in or email). Replies: owners you actually talked to. '
        + 'Calls booked: checks booked. Offers made: prices named. Sales: paid.</p>'
        + (hist ? '<table class="sc-hist"><tr><th>Week of</th><th>Outreach</th><th>Replies</th><th>Booked</th><th>Offers</th><th>Sales</th></tr>'+hist+'</table>' : '');
      $('d-body').querySelectorAll('[data-p]').forEach(function(b){ b.onclick = function(){ scPeriod = b.dataset.p; draw(); }; });
      $('sc-copy').onclick = function(){
        navigator.clipboard.writeText(scText(t, note)).then(function(){ toast('Copied'); }, function(){ toast('Select it and copy by hand'); });
      };
      ['lesson','blocker'].forEach(function(k){
        var el = $('sc-'+k); if(!el) return;
        el.oninput = function(){
          scNotes[t.key] = Object.assign({}, scNotes[t.key]||{}); scNotes[t.key][k] = el.value;
          clearTimeout(el._t);
          el._t = setTimeout(function(){
            if(scColl) scColl.doc(t.key).set({lesson:scNotes[t.key].lesson||'', blocker:scNotes[t.key].blocker||'', updated:new Date().toISOString()})
              .catch(function(){ toast('Could not save'); });
          }, 700);
        };
      });
    }
    draw();
    $('dlg').showModal();
  }

  // ---- events ----
  $('list').addEventListener('click', function(e){
    var r = e.target.closest('.row'); if(!r) return;
    selId = r.dataset.id; render();
    if(window.matchMedia('(max-width:979px)').matches) $('panel').scrollIntoView({behavior:'smooth', block:'start'});
  });
  $('filters').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if(!b) return;
    filter = b.dataset.f;
    $('filters').querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c===b); });
    render();
  });
  $('b-script').onclick = openScript;
  $('b-score').onclick = openScorecard;
  $('b-add').onclick = openAdd;
  $('b-import').onclick = openImport;
  $('b-export').onclick = openExport;
  $('d-x').onclick = function(){ $('dlg').close(); };
  $('dlg').addEventListener('close', function(){ $('dlg').classList.remove('wide'); });
  // clocks move: redraw the list and the panel clock every minute, never the panel itself (you may be typing)
  setInterval(function(){ renderList(); var l = leads.filter(function(x){ return x.id===selId; })[0], c = $('p-clock');
    if(l && c){ var w = windowOf(l); c.className = 'win '+w.cls; c.innerHTML = '<i></i>Their time '+esc(w.txt); } }, 60000);

  render();
  banner('Connecting to your saved list...');

  (async function(){
    try{
      db = await window.claude?.use?.('db');
      if(!db){ banner('Running without storage, so nothing here will be kept. Export before you close the tab.'); return; }
      coll = db.collection('prospects');
      scColl = db.collection('scorecard');
      scColl.onSnapshot(function(snap){
        snap.docs.forEach(function(d){ scNotes[d.id] = d.data(); });
      }, function(){});
      coll.limit(1000).onSnapshot(function(snap){
        var incoming = snap.docs.map(function(d){
          var o = Object.assign(blank(), d.data()); o.id = d.id; return o;
        });
        var here = Object.create(null);
        incoming.forEach(function(d){ serverSeen[d.id] = 1; here[d.id] = 1; });
        // Keep only rows this tab created that the server hasn't confirmed yet.
        // A row the server HAS sent before and is now missing was deleted
        // elsewhere, so it must go rather than linger as a ghost.
        var pending = leads.filter(function(l){ return !serverSeen[l.id] && !here[l.id]; });
        leads = incoming.concat(pending);
        if(selId && !leads.some(function(l){ return l.id===selId; })) selId = null;
        if(!selId && leads.length) selId = visible()[0] && visible()[0].id;
        ready = true; banner(''); render();
      }, function(){ banner('Storage dropped out. Export your list before closing.'); });
    }catch(e){ banner('Running without storage, so nothing here will be kept. Export before you close the tab.'); }
  })();
})();
</script>
