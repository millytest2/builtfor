# LA metro — the WORKING parts of it, where trades actually operate.
# Deliberately NOT Beverly Hills / Santa Monica / WeHo (guru-saturated, agency-
# heavy, and the businesses there already have websites). These are the valley,
# South Bay, Gateway Cities and high-desert pockets where a septic/fence/tree
# outfit is still run off a phone and a truck.
#
# Why this list matters: in-person visits and warm referrals only work where you
# physically are. A lead 2,000 miles away can never become a coffee.

