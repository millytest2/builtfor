# Per-client record. Copy to <business_slug>.yaml at sale time. This one file is
# the single source of truth: intake for delivery + recurring tracking for ops.
# Files starting with "_" (like this template) are ignored by the roster tool.

business:
  name: ""
  google_query: ""          # "Name, City ST" — exactly what finds them on Maps
  owner_name: ""
  owner_phone: ""
  owner_email: ""
  vertical: ""              # barbershop / restaurant / septic / ...

engagement:
  # package: website | visibility | ai_systems  (the three things we do)
  package: "website"
  status: "lead"           # lead | sold | delivering | active | paused | churned
  price_onetime: 0         # website build or one-time fix fee
  monthly_fee: 0           # maintenance / retainer (0 if none)
  paid: ""                 # deposit / paid-in-full / date
  sold_on: ""              # YYYY-MM-DD
  due_by: ""               # delivery deadline
  started: ""              # YYYY-MM-DD recurring started (for MRR)
  deliverer: ""            # Miles / Daniel / VA
  next_check: ""           # YYYY-MM-DD next monthly maintenance touch

intake:
  services_list: []        # what they want more of, in their words
  hours: ""
  service_area: ""
  photos_received: false
  gbp_manager_invite_sent: false     # client adds our email as GBP Manager
  domain: ""               # theirs or we provision
  logins_via: ""           # password-manager entry name (never store here)
  anything_to_avoid: ""

# WEBSITE package specifics
website:
  builder: ""              # emergent / webild / replit / manus
  live_url: ""
  seo_aeo_geo_done: false  # title/meta, LocalBusiness schema, AI-answer check
  click_to_call: false
  booking_or_form: false
  reviews_embedded: false

# VISIBILITY package specifics (the owner.com-style cleanup)
visibility:
  gbp_completed: false
  listings_synced: false   # Apple/Bing/Yelp/Facebook match
  review_kit_delivered: false

artifacts:
  before_report: ""        # output/audits/<slug>.html (day 1 baseline)
  after_report: ""
  review_link: ""

done_check:                # objective definition of done (see service_delivery.md)
  before_after_sent: false
  gbp_grade_a: false
  website_grade_b: false   # website package only
  followup_sent: false
