<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{META_DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{META_DESC}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{CANONICAL}}">
<style>
:root{
  --ink:#16191c; --ink-2:#4a5158; --ink-3:#6b7480;
  --paper:#fff; --paper-2:#f4f6f7; --line:#dfe3e6;
  --brand:{{BRAND}}; --brand-ink:#fff;
  --radius:10px; --wrap:1060px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e9edf0; --ink-2:#aeb7c0; --ink-3:#8b949e;
    --paper:#121517; --paper-2:#1a1e21; --line:#2b3136;
  }
}
:root[data-theme="dark"]{
  --ink:#e9edf0; --ink-2:#aeb7c0; --ink-3:#8b949e;
  --paper:#121517; --paper-2:#1a1e21; --line:#2b3136;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px}
a{color:inherit}
img{max-width:100%;height:auto;display:block}

/* call bar — the single most important element on a trades site */
.callbar{position:sticky;top:0;z-index:50;background:var(--brand);color:var(--brand-ink)}
.callbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:9px;padding-bottom:9px}
.callbar b{font-size:15px;font-weight:600}
.callbar a{background:var(--brand-ink);color:var(--brand);text-decoration:none;font-weight:700;
  padding:9px 16px;border-radius:var(--radius);white-space:nowrap;font-size:16px}

header.site{border-bottom:1px solid var(--line);padding:18px 0}
header.site .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:700;text-decoration:none;letter-spacing:-.01em}
nav a{margin-left:18px;text-decoration:none;color:var(--ink-2);font-size:15px}
nav a:hover{color:var(--ink)}
@media(max-width:640px){nav{width:100%;margin-top:10px}nav a{margin:0 16px 0 0;display:inline-block}}

.hero{padding:46px 0 38px}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0 0 14px;letter-spacing:-.02em}
.hero p.lede{font-size:clamp(17px,2.2vw,20px);color:var(--ink-2);margin:0 0 24px;max-width:60ch}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;text-decoration:none;font-weight:600;padding:13px 22px;border-radius:var(--radius);font-size:16px}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{border:1px solid var(--line);color:var(--ink)}

.trust{display:flex;gap:22px;flex-wrap:wrap;color:var(--ink-2);font-size:15px;margin-top:22px}
.trust span{display:flex;align-items:center;gap:7px}

section{padding:40px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(22px,3vw,29px);margin:0 0 8px;letter-spacing:-.015em}
.sub{color:var(--ink-2);margin:0 0 24px;max-width:62ch}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--paper-2);
  text-decoration:none;color:inherit;display:block}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0;color:var(--ink-2);font-size:15px}

.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.gallery img{border-radius:var(--radius);aspect-ratio:4/3;object-fit:cover;width:100%}

.reviews{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.review{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--paper-2)}
.review p{margin:0 0 10px;font-size:15px}
.review cite{color:var(--ink-3);font-style:normal;font-size:14px}
.stars{color:#e0a800;letter-spacing:2px;font-size:14px;margin-bottom:8px}

details{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:9px;background:var(--paper-2)}
details summary{cursor:pointer;font-weight:600;font-size:16px}
details p{margin:10px 0 0;color:var(--ink-2)}

.towns{display:flex;flex-wrap:wrap;gap:8px}
.towns a{text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 15px;
  font-size:14px;color:var(--ink-2);background:var(--paper-2)}

.band{background:var(--paper-2);border-radius:var(--radius);padding:28px;text-align:center}
.band h2{margin-bottom:6px}

footer{border-top:1px solid var(--line);padding:30px 0;color:var(--ink-2);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer a{color:var(--ink-2)}
.nap{font-style:normal;line-height:1.8}
</style>
{{JSONLD}}
</head>
<body>

<div class="callbar"><div class="wrap">
  <b>{{CALLBAR}}</b>
  <a href="tel:{{PHONE_RAW}}">Call {{PHONE}}</a>
</div></div>

<header class="site"><div class="wrap">
  <a class="brand" href="{{ROOT}}">{{BIZ}}</a>
  <nav>{{NAV}}</nav>
</div></header>

{{BODY}}

<footer><div class="wrap">
  <address class="nap">
    <strong>{{BIZ}}</strong><br>
    {{ADDRESS_HTML}}
    <a href="tel:{{PHONE_RAW}}">{{PHONE}}</a>
  </address>
  <div>{{HOURS_HTML}}</div>
  <div>&copy; {{YEAR}} {{BIZ}}<br>{{SERVING}}</div>
</div></footer>

</body>
</html>
